<!-- Project Overview — the pipeline control centre (projects mode, see specs/projects_mode/).
     A left→right workflow of the four project activities:
        Documents → Problem Framing → Quality → Coverage         [ ▶ Run All ]
     Rules (as specified by the user):
       • "Run All" (right end) runs the whole chain in order; framing is auto-accepted.
       • Clicking a single activity runs ONLY that activity, and is enabled only when
         every activity to its LEFT has run at least once.
     Status for every node is read live from the API on load and after each run. -->
<meta charset="utf-8">
<title>Overview · reqoach</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme=(document.cookie.split('; ').find(c=>c.startsWith('reqoach-theme='))||'=light').split('=')[1];</script>
<link rel="stylesheet" href="css/nav.css">
<style>
  :root{
    --surface:#fcfcfb; --plane:#e9e9e9; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --accent:#2a78d6; --s1:#d03b3b; --s2:#ec835a; --s3:#fab219; --s4:#6bbf59; --s5:#0ca30c;
    --panel2:rgba(11,11,11,.05); --ok:#0ca30c; --run:#2a78d6;
  }
  html[data-theme="dark"]{
    --surface:#1a1a19; --plane:#0d0d0d; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --panel2:rgba(255,255,255,.06); --run:#3987e5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 12px;border-bottom:1px solid var(--border)}
  header h1{font-size:16px;margin:0 0 0 5px;font-weight:600}
  header .sub{color:var(--muted);font-size:12.5px;margin-left:2px}
  main{padding:26px 22px}

  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;
    padding:10px 17px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

  /* ---- pipeline strip ---- */
  .pipe{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 18px}
  .node{position:relative;flex:1 1 0;min-width:190px;background:var(--surface);
    border:1.5px solid var(--border);border-radius:13px;padding:15px 16px 14px;
    display:flex;flex-direction:column;gap:8px;transition:border-color .14s,box-shadow .14s,opacity .14s}
  .node .top{display:flex;align-items:center;gap:9px}
  .node .idx{width:23px;height:23px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:12px;font-weight:700;background:var(--panel2);color:var(--ink2)}
  .node .name{font-weight:600;font-size:14px}
  .node .desc{color:var(--muted);font-size:12px;line-height:1.4;min-height:32px}
  .node .state{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
  .node .dot{width:9px;height:9px;border-radius:50%;background:var(--axis);flex:none}
  .node .when{color:var(--muted);font-weight:400;font-size:11.5px}
  .node .act{margin-top:2px;display:flex;gap:8px;align-items:center}
  .node .run{border:1px solid var(--accent);background:transparent;color:var(--accent);
    border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .node .run:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .node .link{color:var(--accent);font-size:12px;text-decoration:none;font-weight:600}
  .node .link:hover{text-decoration:underline}
  .node .link.danger{color:var(--bad,#c0392b);font-weight:500}
  .node .abort{border:1px solid var(--s1);background:transparent;color:var(--s1);
    border-radius:8px;padding:5px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .node .abort:hover{background:color-mix(in srgb,var(--s1) 12%,transparent)}
  .node .abort:disabled{opacity:.5;cursor:default}

  /* in-node live progress */
  .prog{margin-top:4px;display:flex;flex-direction:column;gap:5px}
  .pstage{font-size:12px;font-weight:600;color:var(--run)}
  .pbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden}
  .pbar span{display:block;height:100%;background:var(--run);border-radius:4px;transition:width .45s ease}
  .pcount{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .pmsg{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    border-radius:5px;padding:1px 7px}
  .badge.ratified{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
  .badge.draft{background:color-mix(in srgb,var(--s3) 20%,transparent);color:var(--s3)}

  /* node status variants */
  .node.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--border))}
  .node.done .dot{background:var(--ok)}
  .node.ready{border-color:var(--accent);box-shadow:0 3px 14px color-mix(in srgb,var(--accent) 16%,transparent)}
  .node.ready .dot{background:var(--accent)}
  .node.locked{opacity:.5}
  .node.locked .idx{opacity:.7}
  .node.running{border-color:var(--run)}
  .node.running .dot{background:var(--run);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* connector arrow between nodes */
  .conn{flex:0 0 34px;display:grid;place-items:center;color:var(--axis)}
  .phase-sec{margin:6px 0}
  .sec-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#8080801f;border:0;
    cursor:pointer;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;
    color:var(--ink2,var(--muted));padding:9px 10px;border-radius:5px}
  .sec-head:hover{color:var(--ink)}
  .sec-caret{display:inline-block;transition:transform .15s;font-size:19.2px;color:var(--muted)}
  .sec-head.collapsed .sec-caret{transform:rotate(-90deg)}
  .sec-body.hidden{display:none}
  #pipe-architect .node{max-width:340px}
  #pipe-planner .node{max-width:340px}
  .conn svg{width:22px;height:22px}
  .conn.flow{color:var(--ok)}

  /* run-all rail */
  .rail{display:flex;align-items:center;gap:14px;margin:2px 0 22px}
  .rail .hint{color:var(--muted);font-size:12.5px}
  .manage-hint{margin:0 0 14px;padding:10px 14px;border-radius:10px;font-size:13px;
    background:color-mix(in srgb,var(--accent) 8%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink)}
  .manage-hint a{color:var(--accent);font-weight:600}
  .node button.disabled,.runall:disabled,.delbtn:disabled{opacity:.45;cursor:not-allowed}
  .runall{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;
    padding:3px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
  .runall:hover{filter:brightness(1.06)} .runall:disabled{opacity:.5;cursor:not-allowed;filter:none}
  .abortall{border:1px solid var(--s1);background:transparent;color:var(--s1);border-radius:10px;
    padding:3px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .abortall:hover{background:color-mix(in srgb,var(--s1) 12%,transparent)}
  .abortall:disabled{opacity:.5;cursor:default}
  .delbtn{border:1px solid var(--s1);background:var(--s1);color:#fff;border-radius:7px;
    padding:3px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .delbtn:hover{filter:brightness(1.06)} .delbtn:disabled{opacity:.5;cursor:default;filter:none}

  .note{background:var(--surface);border:1px solid var(--border);border-radius:11px;
    padding:14px 17px;color:var(--ink2);font-size:13px;line-height:1.6;max-width:820px}
  .note b{color:var(--ink)}
  #log{margin-top:14px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;
    white-space:pre-wrap;min-height:18px}
  /* Knowledge Base lane */
  .kb-bar{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
  #kbUploadWrap{margin-left:auto;text-transform:none;letter-spacing:normal}   /* right-aligned; don't inherit the header's uppercase */
  .kb-upload{display:inline-flex;cursor:pointer}
  .kb-note{color:var(--muted);font-size:12.5px}
  .kb-table{width:100%;border-collapse:collapse;font-size:13px}
  .kb-table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;
    padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
  .kb-table th:last-child{cursor:default}
  .kb-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  .kb-table tr:hover td{background:var(--plane)}
  .kb-name{color:var(--ink);font-weight:600;text-decoration:none}
  .kb-name:hover{text-decoration:underline}
  .kb-size,.kb-when{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .kb-chip{display:inline-block;background:var(--plane);border:1px solid var(--border);border-radius:20px;
    padding:1px 9px;font-size:11.5px;color:var(--ink2);margin:1px 3px 1px 0}
  .kb-attach{position:relative;display:inline-block}
  .kb-attach>summary{list-style:none;cursor:pointer;color:var(--accent);font-size:12px;font-weight:600}
  .kb-attach>summary::-webkit-details-marker{display:none}
  .kb-pop{position:absolute;z-index:20;top:120%;left:0;min-width:200px;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px}
  .kb-pop label{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;font-size:12.5px;cursor:pointer}
  .kb-pop label:hover{background:var(--plane)}
  .kb-pop-foot{display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
  .kb-hint{margin-right:auto;font-size:11px;color:var(--muted)}
  .kb-saved{font-size:11.5px;color:var(--s4);font-weight:600}
  .kb-done{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:6px;
    padding:3px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .kb-done:hover{background:var(--plane)}
  .kb-del{border:none;background:none;color:var(--s1);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px}
  .kb-del:hover{background:color-mix(in srgb,var(--s1) 12%,transparent)}
  .kb-empty{color:var(--muted);font-size:13px;padding:14px 2px}
</style>

<header>
  <div><h1 id="ptitle">Project</h1></div>
  <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
    <button class="delbtn" id="delProject" title="Delete this project and all its data">🗑 Delete</button>
    <button class="abortall" id="abortAll" style="display:none">■ Abort</button>
    <button class="runall" id="runAll" disabled><span>▶</span> Run All</button>
  </div>
</header>
<main>
  <div class="manage-hint" id="manageHint" style="display:none"></div>

  <section class="phase-sec">
    <div class="sec-head" role="button" tabindex="0" aria-expanded="true"><span class="sec-caret">▾</span>Knowledge Base<span id="kbUploadWrap"><label class="kb-upload">
      <input type="file" id="kbFile" multiple hidden>
      <span class="runall">⇪ Upload Documents</span>
    </label></span></div>
    <div class="sec-body">
      <div class="kb-bar">
        <span class="kb-note" id="kbNote"></span>
      </div>
      <table class="kb-table" id="kbTable">
        <thead><tr>
          <th data-sk="filename">Name</th>
          <th data-sk="projects">Projects</th>
          <th data-sk="size">Size</th>
          <th data-sk="uploaded_at">Uploaded</th>
          <th></th>
        </tr></thead>
        <tbody id="kbRows"></tbody>
      </table>
      <div class="kb-empty" id="kbEmpty" style="display:none"></div>
    </div>
  </section>

  <section class="phase-sec">
    <button type="button" class="sec-head" aria-expanded="true"><span class="sec-caret">▾</span>Analyst</button>
    <div class="sec-body"><div class="pipe" id="pipe"></div></div>
  </section>

  <section class="phase-sec">
    <button type="button" class="sec-head" aria-expanded="true"><span class="sec-caret">▾</span>Architect</button>
    <div class="sec-body"><div class="pipe" id="pipe-architect"></div></div>
  </section>

  <section class="phase-sec">
    <button type="button" class="sec-head" aria-expanded="true"><span class="sec-caret">▾</span>Planner</button>
    <div class="sec-body"><div class="pipe" id="pipe-planner"></div></div>
  </section>

  <div id="log"></div>
</main>

<script src="js/nav.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pid = new URLSearchParams(location.search).get('project');
const Q = '?project=' + encodeURIComponent(pid);
const when = iso => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';

// The pipeline stages, in the enforced order. Structure (vocabulary + feature-branch tree)
// is a HARD dependency for the Architect — it designs per branch — so it runs before
// Classification/Coverage and gates everything downstream.
const STAGES = [
  { key: 'framing',   name: 'Problem Framing',  desc: 'Distil a structured problem statement from the documents.' },
  { key: 'quality',   name: 'Quality',          desc: 'INCOSE per-requirement scoring (C1–C9) + set-level checks.' },
  { key: 'overlaps',  name: 'Deduplicate',      desc: 'Merge duplicate / substantially-overlapping requirements (set-level, reranker-confirmed) into one — a clean set before refinement.' },
  { key: 'refine',    name: 'Refinement',       desc: 'The defining capability — rewrite every below-threshold requirement toward INCOSE compliance (bounded 3 attempts), composing the obvious action for terse bullets.' },
  { key: 'structure', name: 'Structure',        desc: 'Vocabulary (glossary + tags) + requirement tree (feature branches) — the Architect designs one aspect per branch.' },
  { key: 'classify',  name: 'Classification',   desc: 'Label each requirement — routing classes, type, constraints (the Architect contract).' },
  { key: 'coverage',  name: 'Coverage',         desc: '16-domain judge panel — are the requirements enough?' },
  { key: 'release',   name: 'Release',          desc: 'Human sign-off — approve the set for the Architect, then download the package.' },
];

let STATE = {};   // per-stage {done,…} + transient _running/_prog/_stage/_jobId/_runStartMs/_stageStartMs
let busy = false;
let ticker = null;
let HASDOCS = false;   // does the selected project have ≥1 Knowledge-Base document attached?
let PROJECT = null;   // current project meta (carries owner)
let MANAGE = true;    // may the signed-in user manage this project? (owner or admin)
let ARCH = { running: false, stage: null, jobId: null };   // Architect row (separate service)
let PLAN = { running: false, stage: null, jobId: null, prog: null };   // Planner row (its own service)

function log(msg) { $('log').textContent = msg || ''; }

// Friendly names for the pipeline sub-stages the backend emits.
const STAGE_LABEL = {
  queued: 'Queued', framing: 'Distilling problem statement',
  ingest: 'Reading documents', segment: 'Segmenting requirements',
  gate: 'Filtering non-requirements', score: 'Assessing requirements',
  review: 'Reviewing flagged requirements', set_level: 'Set-level analysis',
  refine: 'Refining below-threshold requirements',
  rescore: 'Re-assessing revised requirements', setlevel: 'Set-level analysis (duplicates / consistency)',
  classify: 'Classifying requirements',
  structure: 'Building vocabulary + feature tree', vocabulary: 'Extracting vocabulary',
  branches: 'Proposing feature branches', assign: 'Assigning requirements to branches',
  requirements: 'Gathering requirements', judges: 'Domain-expert judges', synthesis: 'Synthesising findings',
};
function fmtDur(s) {
  s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${ss}s` : `${ss}s`;
}

async function loadState() {
  const [proj, ps] = await Promise.all([
    fetch('/analyst/projects/' + encodeURIComponent(pid)).then(r => r.ok ? r.json() : Promise.reject('project')),
    fetch('/analyst/projects/' + encodeURIComponent(pid) + '/problem-statement').then(r => r.ok ? r.json() : {}),
  ]);
  $('ptitle').textContent = proj.name || 'Project';
  document.title = (proj.name || 'Project') + ' · reqoach';

  // Managing (running stages, editing, sign-off) is owner-or-admin only. Browsing is public.
  PROJECT = proj;
  MANAGE = window.ReqoachAuth ? (await window.ReqoachAuth.me(), window.ReqoachAuth.canManage(proj)) : true;

  const docs = proj.documents || [], qr = proj.quality_runs || [], cr = proj.coverage_runs || [];
  HASDOCS = docs.length > 0;   // gates Problem Framing (documents are managed in the KB lane now)
  const lastWhen = arr => arr.length ? (arr.map(r => r.finished_at || '').sort().slice(-1)[0]) : '';
  // Per-stage headline metrics — reported on each block as the stage's results land.
  // Classification + structure status live outside project meta, so fetch them (cheap) only
  // when there is a quality run to describe.
  const sortByFinished = arr => arr.slice().sort((a, b) => (a.finished_at || '').localeCompare(b.finished_at || ''));
  const qLatest = qr.length ? sortByFinished(qr).slice(-1)[0] : null;
  const cLatest = cr.length ? sortByFinished(cr).slice(-1)[0] : null;
  const [cls, structure, refine, overlaps] = qr.length ? await Promise.all([
    fetch('/analyst/projects/' + encodeURIComponent(pid) + '/classification').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/analyst/projects/' + encodeURIComponent(pid) + '/structure').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/analyst/projects/' + encodeURIComponent(pid) + '/refine').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/analyst/projects/' + encodeURIComponent(pid) + '/overlaps').then(r => r.ok ? r.json() : {}).catch(() => ({})),
  ]) : [{}, {}, {}, {}];
  STATE = {
    framing:   { done: !!(ps && ps.version >= 1 && ps.statement), ratified: !!(ps && ps.ratified), when: ps && ps.updated_at },
    quality:   { done: qr.length > 0, when: lastWhen(qr), count: qr.length,
                 info: qLatest && qLatest.total ? qLatest.total + ' requirements' : '',
                 runId: qLatest ? qLatest.run_id : null },
    overlaps:  { done: !!overlaps.done,
                 info: overlaps.done ? (overlaps.merged + ' merged, ' + overlaps.absorbed + ' removed') : (overlaps.detected ? overlaps.detected + ' detected' : '') },
    refine:    { done: !!refine.done,
                 info: refine.done ? (refine.refined + ' refined' + (refine.rejected ? ', ' + refine.rejected + ' rejected' : '') + (refine.needs_human ? ', ' + refine.needs_human + ' need human' : '') + (refine.mean_after != null ? ' · mean ' + refine.mean_after : '')) : '' },
    structure: { done: !!structure.done,
                 info: structure.done ? structure.branches + ' branches · ' + structure.glossary + ' terms' : '' },
    classify:  { done: !!cls.done, info: cls.total ? cls.classified + '/' + cls.total + ' classified' : '' },
    coverage:  { done: cr.length > 0, when: lastWhen(cr), count: cr.length,
                 info: cLatest && cLatest.gap_count != null ? cLatest.gap_count + ' coverage gaps' : '' },
    release:   { done: false },   // filled from /release below (needs a quality run)
  };
  // Release readiness — the gate verdict. Fetch when there is a run to release.
  if (qr.length) {
    const rel = await fetch('/analyst/projects/' + encodeURIComponent(pid) + '/release').then(r => r.ok ? r.json() : {}).catch(() => ({}));
    STATE.release = {
      done: rel.release_status === 'validated',
      status: rel.release_status || 'draft',
      canRelease: !!rel.can_release,
      architectReady: !!rel.architect_ready,
      hardBlockers: rel.hard_blockers || [],
      releasedBy: rel.released_by, releasedAt: rel.released_at,
      runId: rel.run_id,
    };
  }
  // Architect row: ready once the set is Architect-ready; done once an architecture is committed.
  const arch = await fetch('repos/' + encodeURIComponent(pid) + '/architecture').then(r => r.ok ? r.json() : {}).catch(() => ({}));
  // Release-gate state (Architect→Planner, Planner→Development): mode auto/manual + approval.
  const gsettings = await fetch('/analyst/projects/' + encodeURIComponent(pid) + '/settings').then(r => r.ok ? r.json() : {}).catch(() => ({}));
  STATE.gates = (gsettings && gsettings.gates) || { analyst: { mode: 'auto', effective: true }, architect: { mode: 'auto', effective: true }, planner: { mode: 'auto', effective: true } };
  // Analyst release gate: auto → the Architect proceeds once the analyst pipeline is complete;
  // manual → it defers to the requirements-release sign-off (release_status validated).
  const analystPipelineDone = STAGES.filter(s => s.key !== 'release').every(s => (STATE[s.key] || {}).done);
  const analystGate = (STATE.gates.analyst || { mode: 'auto' });
  const architectGateReady = analystGate.mode === 'auto'
    ? analystPipelineDone
    : !!(STATE.release && STATE.release.done);
  const dr = (arch && arch.design_review) || {};
  STATE.architect = {
    done: !!(arch && arch.exists),
    ready: architectGateReady,
    aspects: (arch && arch.aspects) ? arch.aspects.length : 0,
    components: (arch && arch.aspects) ? arch.aspects.reduce((n, a) => n + ((a.components || []).length), 0) : 0,
    openIssues: (arch && arch.open_issues) ? arch.open_issues.length : 0,
    // Design-plausibility judge: how many aspects it flagged as incoherent (out-of-domain / drift).
    review: { incoherent: (dr.incoherent || []).length,
              ran: !!(dr.results && Object.keys(dr.results).length), error: dr.error || null },
  };
  // Planner row: ready once an architecture is committed; done once a plan is committed.
  const plan = await fetch('repos/' + encodeURIComponent(pid) + '/plan').then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const psum = (plan && plan.summary) || {};
  const prv = (plan && plan.plan_review) || {};
  // Gap-resolution dispositions (assume / refine / needs_input …) — surfaced as its own block.
  const gaps = (plan && plan.exists)
    ? await fetch('/analyst/projects/' + encodeURIComponent(pid) + '/planner-gaps').then(r => r.ok ? r.json() : {}).catch(() => ({}))
    : {};
  STATE.planner = {
    done: !!(plan && plan.exists),
    // Ready once the design is committed AND the Architect release gate is satisfied
    // (auto, or manually approved). A manual, unapproved gate blocks planning.
    ready: !!(STATE.architect && STATE.architect.done && ((STATE.gates.architect || {}).effective !== false)),
    tasks: psum.feasible || 0,
    questions: psum.questions || 0,
    flagged: psum.flagged || 0,
    gaps: { counts: gaps.counts || {}, total: gaps.total || 0 },
    review: { drift: (prv.implausible || []).length, incomplete: (prv.incomplete || []).length,
              ran: !!(prv.results && Object.keys(prv.results).length) },
  };
  render();
  renderArchitect();
  renderPlanner();

  // If a run is already in flight (e.g. the page was reloaded mid-run), reattach to it
  // so the live progress + Abort come back instead of the run looking idle.
  if (!busy) {
    const aj = await fetch('/analyst/projects/' + encodeURIComponent(pid) + '/active-job')
      .then(r => r.ok ? r.json() : {}).catch(() => ({}));
    if (aj && aj.job_id) reattach(aj);
  }
}

function pipelineSummary() {
  const done = STAGES.filter(s => STATE[s.key] && STATE[s.key].done).length;
  return done === STAGES.length ? 'Pipeline complete — all stages have run.'
       : done === 0 ? 'Pipeline not started.'

}

// stage i is enabled iff every earlier stage is done
function enabledIndex(i) { for (let k = 0; k < i; k++) if (!(STATE[STAGES[k].key] || {}).done) return false; return true; }

const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';

function render() {
  const parts = [];
  STAGES.forEach((s, i) => {
    if (i) parts.push(`<div class="conn ${STATE[STAGES[i - 1].key].done ? 'flow' : ''}">${ARROW}</div>`);
    parts.push(nodeHTML(s, i));
  });
  $('pipe').innerHTML = parts.join('');
  // wire per-node run + abort buttons
  STAGES.forEach(s => {
    const rb = document.getElementById('run-' + s.key);
    // Quality's "Re-run" reassesses the REVISED requirements (review-preserving); the
    // first run and every other stage keep the normal extraction path.
    if (rb) rb.addEventListener('click',
      () => (s.key === 'quality' && STATE.quality.done) ? runRescore() : runStage(s.key));
    const ab = document.getElementById('abort-' + s.key);

  const rv = document.getElementById('revoke-release');
  if (rv) rv.addEventListener('click', revokeRelease);

  STAGES.forEach(s => { if (STATE[s.key] && STATE[s.key]._running) renderProg(s.key); });

  $('runAll').innerHTML = allDone ? '<span>↻</span> Re-run All' : '<span>▶</span> Run All';
  $('abortAll').style.display = busy ? '' : 'none';

  // (they can still read everything) and explain why. The server enforces this regardless.
  if (!MANAGE) {

      .forEach(b => { b.disabled = true; b.classList.add('disabled'); });

    $('manageHint').innerHTML = who
      ? `You are viewing <b>${esc(owner || 'this project')}</b>'s project as <b>${esc(who)}</b> — only the owner or the administrator can run or change it.`

    $('manageHint').style.display = '';

// A release-gate block: auto (passes on completion) or manual (needs human sign-off before the

// Human sign-off: approve the set for the Architect (gate-checked server-side) / revoke it.
async function approveRelease() {
  if (busy) return;
  const run = STATE.release && STATE.release.runId; if (!run) return;
  // The signer's identity IS the authenticated account — no name to type. Cancel aborts.
  const who = (window.ReqoachAuth && window.ReqoachAuth.email()) || 'you';
  if (!confirm(`Approve this requirement set for the Architect?\n\nIt will be signed off as ${who} and marked validated (Architect-ready).`)) return;
  try {
    const r = await fetch('/analyst/projects/' + encodeURIComponent(pid) + '/reviews/' + encodeURIComponent(run) + '/release',
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'approve' }) });
    if (r.status === 401 || r.status === 403) { if (window.ReqoachAuth) window.ReqoachAuth.needAuth(r); return; }
    if (r.status === 409) { const b = await r.json().catch(() => ({})); alert('Cannot release — fix these first:\n\n• ' + ((b.detail && b.detail.hard_blockers) || b.hard_blockers || ['blockers remain']).join('\n• ')); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    log('Signed off — the set is validated and Architect-ready.');
  } catch (e) { alert('Sign-off failed:\n' + e.message); }
  finally { await loadState(); }
}
async function revokeRelease() {
  if (busy) return;
  const run = STATE.release && STATE.release.runId; if (!run) return;
  if (!confirm('Revoke the sign-off and return this set to draft?')) return;
  try {
    await fetch('/analyst/projects/' + encodeURIComponent(pid) + '/reviews/' + encodeURIComponent(run) + '/release',
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'revoke' }) });
    log('Sign-off revoked — back to draft.');
  } catch (e) { alert('Revoke failed:\n' + e.message); }
  finally { await loadState(); }
}

// Buttons/links inside a node: primary run/open + a view link when there is output.
function actionLinks(s, done) {
  const view = {
    framing:   `<a class="link" href="coverage.html${Q}">Review &amp; ratify →</a>`,
    quality:   `<a class="link" href="index.html${Q}">Open dashboard →</a>`,
    coverage:  `<a class="link" href="coverage.html${Q}">Open coverage →</a>`,
  }[s.key];
  // Quality, once run, offers a review-preserving reassessment as the primary Re-run, plus a
  // Re-import (rebuild the requirement set from the current KB documents — supersedes the set).
  if (s.key === 'quality' && done) {
    return `<button class="run" id="run-quality" ${busy ? 'disabled' : ''} title="Re-score the revised requirements — your reviews are preserved">Re-run assessment</button>`
         + view
         + `<a class="link danger" id="reimport-quality" href="#" title="Rebuild the requirement set from the current documents — supersedes the current set and its reviews">Re-import from documents ⚠</a>`;
  }
  const runLabel = done ? 'Re-run' : 'Run';
  return `<button class="run" id="run-${s.key}" ${busy ? 'disabled' : ''}>${runLabel}</button>` + (done && view ? view : '');
}

// ---- live progress readout inside a running node ----
function applySnapshot(key, s) {
  const st = STATE[key]; if (!st) return;
  const p = s.progress || {};
  const stage = p.stage || s.stage || '';
  if (stage && st._stage !== stage) { st._stage = stage; st._stageStartMs = Date.now(); }  // reset ETA baseline per stage
  st._prog = p; st._elapsed = s.elapsed_s;
  renderProg(key);
}

function renderProg(key) {
  const el = document.getElementById('prog-' + key); if (!el) return;
  const st = STATE[key], p = st._prog || {}, stage = st._stage || '';
  const label = STAGE_LABEL[stage] || (stage || 'Working…');
  const elapsedS = st._runStartMs ? (Date.now() - st._runStartMs) / 1000 : (st._elapsed || 0);
  let html = `<div class="pstage">${esc(label)}${elapsedS ? ` · ${fmtDur(elapsedS)} elapsed` : ''}</div>`;
  const done = p.done, total = p.total;
  // On a stage-"start" tick the count is not yet meaningful (e.g. score reports the
  // task total = reqs×9, not requirements) — wait for the first real progress tick.
  if (p.status !== 'start' && typeof total === 'number' && total > 0 && typeof done === 'number') {
    const pct = Math.min(100, Math.round(done / total * 100));
    html += `<div class="pbar"><span style="width:${pct}%"></span></div>`;
    let line = `${done} / ${total}${p.unit ? ' ' + p.unit : ''} · ${pct}%`;
    const stageMs = st._stageStartMs ? (Date.now() - st._stageStartMs) : 0;
    if (done > 0 && total > done && stageMs > 4000) line += ` · ~${fmtDur(stageMs / 1000 / done * (total - done))} left`;
    else if (done > 0 && total > done) line += ' · estimating…';
    html += `<div class="pcount">${line}</div>`;
  }
  if (p.message) html += `<div class="pmsg">${esc(p.message)}</div>`;
  el.innerHTML = html;
}

function startTicker() { if (!ticker) ticker = setInterval(() => STAGES.forEach(s => { if (STATE[s.key] && STATE[s.key]._running) renderProg(s.key); }), 500); }
function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

// ---- job polling (quality + coverage share the /jobs/{id} snapshot) ----
function pollJob(jobId, onStage) {
  return new Promise((resolve, reject) => {
    const t = setInterval(async () => {
      const s = await fetch('/analyst/jobs/' + jobId).then(r => r.ok ? r.json() : null).catch(() => null);
      if (!s) return;
      if (onStage) onStage(s);
      if (s.status === 'done') { clearInterval(t); resolve(s); }
      else if (s.status === 'cancelled') { clearInterval(t); resolve({ cancelled: true }); }
      else if (s.status === 'error') { clearInterval(t); reject(new Error(s.error || 'job failed')); }
    }, 1500);
  });
}

// Auto-accept (ratify) the current problem statement — used by Run All after framing.
async function ratifyCurrent() {
  const ps = await fetch('/analyst/projects/' + encodeURIComponent(pid) + '/problem-statement')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  if (ps && ps.statement) {
    await fetch('/analyst/projects/' + encodeURIComponent(pid) + '/problem-statement',
      { method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statement: ps.statement, ratified: true }) });
  }
}

// Run one stage as a streamed job; returns the final snapshot ({cancelled:true} if aborted).
async function runOne(key) {
  STATE[key]._runStartMs = Date.now();
  // Deduplicate is a SYNCHRONOUS endpoint (no job to poll) — merge and return.
  if (key === 'overlaps') {
    const res = await fetch('/analyst/projects/' + encodeURIComponent(pid) + '/overlaps:merge?apply=true',
      { method: 'POST' });
    if (res.status === 401 || res.status === 403) { if (window.ReqoachAuth) window.ReqoachAuth.needAuth(res); return {}; }
    return await res.json().catch(() => ({}));
  }
  const path = key === 'framing' ? '/framing:run' : key === 'quality' ? '/quality:run'
             : key === 'refine' ? '/refine:run'
             : key === 'structure' ? '/structure:run'
             : key === 'classify' ? '/classify:run' : '/coverage:run';
  const res = await fetch('/analyst/projects/' + encodeURIComponent(pid) + path, { method: 'POST' }).then(r => r.json());
  if (!res.job_id) throw new Error('could not start ' + key);
  STATE[key]._jobId = res.job_id;
  return await pollJob(res.job_id, s => applySnapshot(key, s));
}

async function runStage(key) {
  if (busy) return;
  resetAbortAll();
  busy = true; STATE[key]._running = true; startTicker(); render();
  const label = STAGES.find(s => s.key === key).name;
  log('Running ' + label + '…');
  try {
    const r = await runOne(key);
    log(r && r.cancelled ? label + ' aborted.' : label + ' complete.');
  } catch (e) { log('✗ ' + label + ' failed: ' + e.message); alert(label + ' failed:\n' + e.message); }
  finally { busy = false; stopTicker(); if (STATE[key]) STATE[key]._running = false; await loadState(); }
}

// Re-run Quality as a REVIEW-PRESERVING reassessment: re-score the revised requirements
// (changed-only) + recompute set-level. Reads final_text; never re-ingests the document.
async function runRescore() {
  if (busy) return;
  const run = STATE.quality.runId;
  if (!run) { alert('Run Quality first.'); return; }
  resetAbortAll();
  busy = true; STATE.quality._running = true; STATE.quality._runStartMs = Date.now(); startTicker(); render();
  log('Reassessing revised requirements…');
  try {
    const res = await fetch('/analyst/projects/' + encodeURIComponent(pid) + '/reviews/' + encodeURIComponent(run) + '/rescore:run',
      { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ changed_only: true, set_level: true }) }).then(r => r.json());
    if (!res.job_id) throw new Error('could not start reassessment');
    STATE.quality._jobId = res.job_id;
    const r = await pollJob(res.job_id, s => applySnapshot('quality', s));
    log(r && r.cancelled ? 'Reassessment aborted.' : 'Reassessment complete — dashboard score updated.');
  } catch (e) { log('✗ Reassessment failed: ' + e.message); alert('Reassessment failed:\n' + e.message); }
  finally { busy = false; stopTicker(); if (STATE.quality) STATE.quality._running = false; await loadState(); }
}

// The destructive path: re-read the source documents from scratch. Confirmed, because it
// produces a fresh requirement set and the current reviews stop showing on the dashboard.
async function runReimport() {
  if (busy) return;
  if (!confirm('Re-import re-reads the source documents and builds a NEW requirement set.\n\n'
    + 'It does NOT use your reviewed text, and your current reviews will no longer appear on '
    + 'the dashboard (they are kept under the previous run, not deleted).\n\nContinue?')) return;
  return runStage('quality');
}

async function runAll() {
  if (busy) return;
  if (!HASDOCS) { alert('Attach at least one document in the Knowledge Base first.'); return; }
  resetAbortAll();
  busy = true; startTicker(); render();
  try {
    // Framing (streamed job, then auto-accepted) → Quality → Coverage, in order.
    STATE.framing._running = true; render(); log('Framing the problem…');
    let rf = await runOne('framing');
    STATE.framing._running = false;
    if (rf && rf.cancelled) { log('Pipeline aborted during Framing.'); return; }
    await ratifyCurrent();                                    // auto-accept the generated statement
    STATE.framing.done = true;

    STATE.quality._running = true; render(); log('Running Quality…');
    let r = await runOne('quality');
    STATE.quality._running = false;
    if (r && r.cancelled) { log('Pipeline aborted during Quality.'); return; }
    STATE.quality.done = true;

    STATE.overlaps._running = true; render(); log('Merging duplicate / overlapping requirements…');
    await runOne('overlaps');
    STATE.overlaps._running = false;
    STATE.overlaps.done = true;

    STATE.refine._running = true; render(); log('Refining requirements toward INCOSE compliance…');
    r = await runOne('refine');
    STATE.refine._running = false;
    if (r && r.cancelled) { log('Pipeline aborted during Refinement.'); return; }
    STATE.refine.done = true;

    STATE.structure._running = true; render(); log('Building vocabulary + requirement tree…');
    r = await runOne('structure');
    STATE.structure._running = false;
    if (r && r.cancelled) { log('Pipeline aborted during Structure.'); return; }
    STATE.structure.done = true;

    STATE.classify._running = true; render(); log('Classifying requirements…');
    r = await runOne('classify');
    STATE.classify._running = false;
    if (r && r.cancelled) { log('Pipeline aborted during Classification.'); return; }
    STATE.classify.done = true;

    STATE.coverage._running = true; render(); log('Running Coverage…');
    r = await runOne('coverage');
    STATE.coverage._running = false;
    log(r && r.cancelled ? 'Pipeline aborted during Coverage.' : 'Pipeline complete.');
  } catch (e) { log('✗ Run All stopped: ' + e.message); alert('Run All stopped:\n' + e.message); }
  finally { busy = false; stopTicker(); ['framing', 'quality', 'overlaps', 'refine', 'structure', 'classify', 'coverage'].forEach(k => STATE[k] && (STATE[k]._running = false)); await loadState(); }
}

// Reattach to a job already running server-side (page reloaded mid-run).
function reattach(aj) {
  const key = aj.kind === 'coverage' ? 'coverage' : aj.kind === 'framing' ? 'framing'
            : aj.kind === 'classify' ? 'classify' : aj.kind === 'structure' ? 'structure'
            : aj.kind === 'refine' ? 'refine' : 'quality';
  busy = true; STATE[key]._running = true; STATE[key]._jobId = aj.job_id; startTicker(); render();
  log('Reattached to a running ' + STAGES.find(s => s.key === key).name + ' job…');
  const finish = async () => { busy = false; stopTicker(); if (STATE[key]) STATE[key]._running = false; await loadState(); };
  pollJob(aj.job_id, s => applySnapshot(key, s))
    .then(r => { log(r && r.cancelled ? key + ' aborted.' : key + ' complete.'); return finish(); })
    .catch(e => { log('✗ ' + key + ' failed: ' + e.message); return finish(); });
}

async function abortStage(key) {
  const st = STATE[key]; if (!st || !st._jobId) return;
  const b = document.getElementById('abort-' + key); if (b) { b.disabled = true; b.textContent = 'Aborting…'; }
  try { await fetch('/analyst/jobs/' + st._jobId + '/cancel', { method: 'POST' }); log('Aborting… (finishing in-flight work)'); } catch (e) {}
}

async function abortAll() {
  const b = $('abortAll'); if (b) { b.disabled = true; b.textContent = '■ Aborting…'; }
  const running = STAGES.find(s => STATE[s.key] && STATE[s.key]._running && STATE[s.key]._jobId);
  if (running) { try { await fetch('/analyst/jobs/' + STATE[running.key]._jobId + '/cancel', { method: 'POST' }); } catch (e) {} }
  log('Aborting… (finishing in-flight work)');
}
function resetAbortAll() { const b = $('abortAll'); if (b) { b.disabled = false; b.textContent = '■ Abort'; } }

$('runAll').addEventListener('click', runAll);
$('abortAll').addEventListener('click', abortAll);

// ---- Knowledge Base lane (global documents, many-to-many with projects) ----
const KB = { docs: [], projects: [], sortKey: 'uploaded_at', sortDir: -1, me: null };
const kbBytes = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB'
  : n >= 1024 ? Math.round(n / 1024) + ' KB' : (n || 0) + ' B';

async function loadKB() {
  KB.me = window.ReqoachAuth ? await window.ReqoachAuth.me() : null;
  const authed = !!(KB.me && KB.me.authenticated);
  $('kbUploadWrap').style.display = authed ? '' : 'none';
  $('kbNote').textContent = authed ? '' : 'Sign in to upload and manage documents.';
  const [docsR, projR] = await Promise.all([
    fetch('/analyst/kb/documents').then(r => r.ok ? r.json() : { documents: [] }).catch(() => ({ documents: [] })),
    fetch('/analyst/projects').then(r => r.ok ? r.json() : { projects: [] }).catch(() => ({ projects: [] })),
  ]);
  KB.docs = docsR.documents || [];
  // Projects the signed-in user may attach to: their own; the admin may attach to any.
  const email = window.ReqoachAuth ? window.ReqoachAuth.email() : null;
  const admin = window.ReqoachAuth ? window.ReqoachAuth.isAdmin() : false;
  KB.projects = (projR.projects || []).filter(p => admin || (email && (p.owner || '').toLowerCase() === email));
  renderKB();
}

function kbSort(a, b) {
  const k = KB.sortKey; let av, bv;
  if (k === 'projects') { av = (a.project_names || []).join(', ').toLowerCase(); bv = (b.project_names || []).join(', ').toLowerCase(); }
  else if (k === 'size') { av = a.size || 0; bv = b.size || 0; }
  else { av = (a[k] || '').toString().toLowerCase(); bv = (b[k] || '').toString().toLowerCase(); }
  return (av < bv ? -1 : av > bv ? 1 : 0) * KB.sortDir;
}

function kbCanManage(d) {
  return !!(KB.me && KB.me.authenticated && window.ReqoachAuth
    && (window.ReqoachAuth.isAdmin() || (d.owner || '') === window.ReqoachAuth.email()));
}

function renderKB() {
  const rows = KB.docs.slice().sort(kbSort);
  $('kbEmpty').style.display = rows.length ? 'none' : '';
  $('kbEmpty').textContent = rows.length ? ''
    : (KB.me && KB.me.authenticated ? 'No documents yet — upload one to get started.' : 'No documents to show.');
  $('kbTable').style.display = rows.length ? '' : 'none';
  $('kbRows').innerHTML = rows.map(d => {
    const chips = (d.project_names || []).map(n => `<span class="kb-chip">${esc(n)}</span>`).join('')
      || '<span class="kb-when">—</span>';
    let attach = '';
    if (kbCanManage(d) && KB.projects.length) {
      const opts = KB.projects.map(p =>
        `<label><input type="checkbox" data-did="${d.id}" value="${p.id}" ${(d.projects || []).indexOf(p.id) >= 0 ? 'checked' : ''}>${esc(p.name || 'project')}</label>`).join('');
      attach = `<details class="kb-attach"><summary>Edit ▾</summary><div class="kb-pop">${opts}`
        + `<div class="kb-pop-foot"><span class="kb-hint">Saved automatically</span><span class="kb-saved"></span>`
        + `<button type="button" class="kb-done">Done</button></div></div></details>`;
    }
    const del = kbCanManage(d) ? `<button class="kb-del" data-del="${d.id}" title="Delete from the Knowledge Base">🗑</button>` : '';
    return `<tr data-did="${d.id}">
      <td><a class="kb-name" href="/analyst/kb/documents/${d.id}/source" target="_blank" rel="noopener">${esc(d.filename || 'document')}</a></td>
      <td><span class="kb-chips">${chips}</span> ${attach}</td>
      <td class="kb-size">${kbBytes(d.size)}</td>
      <td class="kb-when">${esc(when(d.uploaded_at))}</td>
      <td>${del}</td>
    </tr>`;
  }).join('');
  $('kbRows').querySelectorAll('.kb-pop input[type=checkbox]').forEach(cb =>
    cb.addEventListener('change', () => kbAttach(cb.dataset.did)));
  $('kbRows').querySelectorAll('.kb-done').forEach(b =>
    b.addEventListener('click', () => { const d = b.closest('.kb-attach'); if (d) d.open = false; }));
  $('kbRows').querySelectorAll('[data-del]').forEach(b =>
    b.addEventListener('click', () => kbDelete(b.dataset.del)));
}

async function kbAttach(did) {
  const row = $('kbRows').querySelector(`tr[data-did="${did}"]`);
  const status = row && row.querySelector('.kb-saved');
  const boxes = $('kbRows').querySelectorAll(`.kb-pop input[data-did="${did}"]`);
  const pids = [...boxes].filter(b => b.checked).map(b => b.value);
  if (status) status.textContent = 'Saving…';
  const r = await fetch('/analyst/kb/documents/' + did, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ projects: pids }),
  });
  if (window.ReqoachAuth && window.ReqoachAuth.needAuth(r)) return;
  if (!r.ok) { if (status) status.textContent = 'Save failed'; return; }
  // Update the local model + this row's chips IN PLACE, so the open popup isn't torn down
  // mid-edit (the user can keep ticking projects) and the change is visibly reflected.
  const d = KB.docs.find(x => x.id === did);
  if (d) {
    d.projects = pids;
    d.project_names = pids.map(p => (KB.projects.find(x => x.id === p) || {}).name || p);
    const chipsCell = row && row.querySelector('.kb-chips');
    if (chipsCell) chipsCell.innerHTML = d.project_names.map(n => `<span class="kb-chip">${esc(n)}</span>`).join('')
      || '<span class="kb-when">—</span>';
  }
  if (status) { status.textContent = 'Saved ✓'; setTimeout(() => { if (status.textContent === 'Saved ✓') status.textContent = ''; }, 1600); }
  if (pid) loadState();   // a project's document set may have changed → refresh the framing gate
}

async function kbDelete(did) {
  if (!confirm('Delete this document from the Knowledge Base? Any project using it will lose it.')) return;
  const r = await fetch('/analyst/kb/documents/' + did, { method: 'DELETE' });
  if (window.ReqoachAuth && window.ReqoachAuth.needAuth(r)) return;
  await loadKB();
  if (pid) loadState();
}

async function kbUpload(files) {
  if (!files || !files.length) return;
  $('kbNote').textContent = 'Uploading…';
  const fd = new FormData();
  [...files].forEach(f => fd.append('files', f));
  const r = await fetch('/analyst/kb/documents', { method: 'POST', body: fd });
  if (window.ReqoachAuth && window.ReqoachAuth.needAuth(r)) { $('kbNote').textContent = ''; return; }
  $('kbNote').textContent = r.ok ? '' : 'Upload failed.';
  $('kbFile').value = '';
  await loadKB();
}

$('delProject').addEventListener('click', async () => {
  const name = $('ptitle').textContent || 'this project';
  if (!confirm(`Delete "${name}" and all its documents and analysis runs?\n\nThis cannot be undone.`)) return;
  const b = $('delProject'); b.disabled = true; b.textContent = 'Deleting…';
  try {
    const r = await fetch('/analyst/projects/' + encodeURIComponent(pid), { method: 'DELETE' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    // Remove the project's git repo too (reqoach lifecycle). Best-effort: the project is
    // already gone; a failed repo delete is a stray dir, not a user-facing error.
    try { await fetch('repos/' + encodeURIComponent(pid), { method: 'DELETE' }); } catch (e) {}
    location.replace('overview.html');
  } catch (e) { b.disabled = false; b.textContent = '🗑 Delete'; alert('Could not delete project:\n' + e.message); }
});

// Collapsible sections — each title toggles its own body; several can be open at once.
document.querySelectorAll('.sec-head').forEach(h => {
  const toggle = () => {
    const collapsed = h.classList.toggle('collapsed');
    h.setAttribute('aria-expanded', String(!collapsed));
    h.nextElementSibling.classList.toggle('hidden', collapsed);
  };
  h.addEventListener('click', toggle);
  // The Knowledge Base header is a <div> (it hosts the interactive Upload control), so it needs
  // explicit keyboard toggling; <button> headers get Enter/Space for free.
  if (h.tagName !== 'BUTTON') h.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
});
// Clicking the Upload control (inside the KB header) must NOT collapse the section.
const _kbw = document.getElementById('kbUploadWrap');
if (_kbw) _kbw.addEventListener('click', e => e.stopPropagation());

if (pid) {
  loadState().catch(() => location.replace('overview.html'));
} else {
  // Home landing — no project selected yet. nav.js sets the title to "Select a Project";
  // show a placeholder and disable the project actions until one is picked from the menu.
  $('delProject').disabled = true;
  $('runAll').disabled = true;
  $('pipe').innerHTML = '<div style="color:var(--muted);padding:16px 2px;font-size:13px">'
    + 'Select a project from the menu above to view and run its pipeline.</div>';
  $('pipe-architect').innerHTML = '';
  $('pipe-planner').innerHTML = '';
}

// Knowledge Base lane — global, so it loads with OR without a project selected.
$('kbFile').addEventListener('change', e => kbUpload(e.target.files));
$('kbTable').querySelectorAll('th[data-sk]').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.sk;
  if (KB.sortKey === k) KB.sortDir *= -1; else { KB.sortKey = k; KB.sortDir = 1; }
  renderKB();
}));
// Dismiss any open project-edit popup: Escape, or a click outside it.
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.kb-attach[open]').forEach(d => { d.open = false; });
});
document.addEventListener('click', e => {
  document.querySelectorAll('.kb-attach[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
});
loadKB();
</script>
