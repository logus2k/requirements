<!-- Requirements → Glossary & Tags. Read-only view of the vocabulary the Structure stage
     built: glossary entries (name, kind, definition, aliases, tracing) + controlled tags. -->
<meta charset="utf-8">
<title>Glossary · reqoach</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme=(document.cookie.split('; ').find(c=>c.startsWith('reqoach-theme='))||'=light').split('=')[1];
if(!new URLSearchParams(location.search).get('project'))location.replace('overview.html');</script>
<link rel="stylesheet" href="css/nav.css">
<style>
  :root{--surface:#fcfcfb;--plane:#e9e9e9;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
    --grid:#e1e0d9;--border:rgba(11,11,11,.10);--accent:#2a78d6;--panel2:rgba(11,11,11,.05)}
  html[data-theme="dark"]{--surface:#1a1a19;--plane:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--border:rgba(255,255,255,.10);--accent:#3987e5;--panel2:rgba(255,255,255,.06)}
  *{box-sizing:border-box}
  html,body{height:100%}
  /* The page fills the viewport and does NOT scroll — the nav, tabs and filter stay fixed;
     only the terms/tags list (.scrollarea) scrolls. */
  body{margin:0;background:var(--plane);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  .reqoach-nav,.reqoach-phases,.reqoach-subtabs,header,.tabbar{flex:none}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 12px;border-bottom:1px solid var(--border)}
  header h1{font-size:16px;margin:0 0 0 5px;font-weight:600}
  header .status{margin-left:auto;color:var(--muted);font-size:12.5px}
  .tabbar{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--border);background:var(--surface)}
  .tabbtn{background:none;border:none;padding:11px 15px;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabbtn:hover{color:var(--ink)} .tabbtn.active{color:var(--ink);border-bottom-color:var(--accent)}
  .tabbtn .c{color:var(--muted);font-weight:600}
  main{flex:1;min-height:0;display:flex;flex-direction:column;padding:18px 22px 0}
  .toolbar{flex:none;display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .req{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--ink);font:inherit;font-size:13.5px;outline:none}
  .req:focus{border-color:var(--accent)}
  /* The ONLY scrolling region — the list of terms / tags. */
  .scrollarea{flex:1;min-height:0;overflow-y:scroll;padding-bottom:34px;
    scrollbar-width:auto;scrollbar-color:var(--muted) var(--panel2)}
  .scrollarea::-webkit-scrollbar{width:14px}
  .scrollarea::-webkit-scrollbar-track{background:var(--panel2)}
  .scrollarea::-webkit-scrollbar-thumb{background:var(--muted);border-radius:7px;border:3px solid var(--panel2);background-clip:content-box}
  .scrollarea::-webkit-scrollbar-thumb:hover{background:var(--accent);background-clip:content-box;border:3px solid var(--panel2)}
  .pane[hidden]{display:none}
  .empty{color:var(--muted);padding:34px 2px;font-size:14px}
  table.gt{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:11px}
  .gt th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;
    padding:9px 13px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2;
    background:color-mix(in srgb,var(--muted) 12%,var(--surface))}
  .gt td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13.5px}
  .gt tr:last-child td{border-bottom:none}
  .gt .tm{font-weight:600;white-space:nowrap} .gt .al{font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px}
  .gt .df{color:var(--ink2)} .gt .rq{color:var(--muted);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-width:120px}
  .kind{display:inline-block;font-size:11px;font-weight:700;text-transform:capitalize;border-radius:5px;padding:2px 8px;
    color:#fff;background:var(--muted)}
  .k-actor{background:#2a78d6} .k-entity{background:#6b56c6} .k-event{background:#ec835a}
  .k-value,.k-attribute{background:#4a9e8e} .k-role{background:#c65692} .k-system{background:#52514e}
  .tagwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .tagcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
  .tagcard .tn{font-weight:600;display:flex;align-items:center;gap:8px}
  .tagcard .ct{margin-left:auto;font-size:11px;color:var(--muted);background:var(--panel2);border-radius:20px;padding:1px 9px}
  .tagcard .td{color:var(--ink2);font-size:12.5px;margin:4px 0}
  .tagcard .rq{color:var(--muted);font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:5px;word-break:break-word}
</style>

<header>
  <div><h1 id="ptitle">Glossary &amp; Tags</h1></div>
  <div class="status" id="status"></div>
</header>
<div class="tabbar">
  <button class="tabbtn active" data-pane="glossary">Glossary <span class="c" id="gcount"></span></button>
  <button class="tabbtn" data-pane="tags">Tags <span class="c" id="tcount"></span></button>
</div>
<main>
  <div class="toolbar"><input id="search" class="req" placeholder="Filter terms, definitions, tags…"></div>
  <div class="scrollarea">
    <div class="pane" id="pane-glossary"></div>
    <div class="pane" id="pane-tags" hidden></div>
  </div>
</main>

<script src="js/nav.js"></script>
<script>
const pid = new URLSearchParams(location.search).get('project');
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let GLOSS = [], TAGS = [];

async function load() {
  try {
    const d = await fetch('/analyst/projects/'+encodeURIComponent(pid)+'/glossary').then(r=>r.ok?r.json():{glossary:[],tags:[]});
    GLOSS = d.glossary||[]; TAGS = d.tags||[];
  } catch(e){ GLOSS=[]; TAGS=[]; }
  fetch('/analyst/projects/'+encodeURIComponent(pid)).then(r=>r.ok?r.json():null)
    .then(p=>{ if(p&&p.name){ $('ptitle').textContent=p.name; document.title=p.name+' — Glossary'; }}).catch(()=>{});
  $('gcount').textContent = GLOSS.length ? '· '+GLOSS.length : '';
  $('tcount').textContent = TAGS.length ? '· '+TAGS.length : '';
  $('status').textContent = (GLOSS.length||TAGS.length) ? '' : 'Run the Structure stage to build the vocabulary.';
  render();
}
function render() {
  const q = ($('search').value||'').trim().toLowerCase();
  const gl = GLOSS.filter(g => !q || (g.name||'').toLowerCase().includes(q) || (g.definition||'').toLowerCase().includes(q) || (g.kind||'').toLowerCase().includes(q))
    .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  $('pane-glossary').innerHTML = gl.length ? (
    '<table class="gt"><thead><tr><th>Term</th><th>Kind</th><th>Definition</th><th>Used by</th></tr></thead><tbody>' +
    gl.map(g => '<tr><td class="tm">'+esc(g.name)+((g.aliases&&g.aliases.length)?'<div class="al">aka '+g.aliases.map(esc).join(', ')+'</div>':'')+'</td>'+
      '<td><span class="kind k-'+esc((g.kind||'').toLowerCase())+'">'+esc(g.kind||'—')+'</span></td>'+
      '<td class="df">'+esc(g.definition||'')+'</td>'+
      '<td class="rq">'+((g.req_ids||[]).map(esc).join(', ')||'—')+'</td></tr>').join('') +
    '</tbody></table>'
  ) : '<div class="empty">No glossary terms'+(q?' match your filter.':' yet — run the Structure stage to build the vocabulary.')+'</div>';

  const tg = TAGS.filter(t => !q || (t.name||'').toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q))
    .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  $('pane-tags').innerHTML = tg.length ? (
    '<div class="tagwrap">' + tg.map(t => '<div class="tagcard"><div class="tn">#'+esc(t.name)+'<span class="ct">'+((t.req_ids||[]).length)+' req'+(((t.req_ids||[]).length)===1?'':'s')+'</span></div>'+
      (t.description?'<div class="td">'+esc(t.description)+'</div>':'')+
      '<div class="rq">'+((t.req_ids||[]).map(esc).join(', ')||'—')+'</div></div>').join('') + '</div>'
  ) : '<div class="empty">No tags'+(q?' match your filter.':' yet.')+'</div>';
}
$('search').addEventListener('input', render);
document.querySelectorAll('.tabbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  $('pane-glossary').hidden = b.dataset.pane!=='glossary';
  $('pane-tags').hidden = b.dataset.pane!=='tags';
}));
load();
</script>
